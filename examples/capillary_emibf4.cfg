# -------------------------------------------------------------------------
# Single capillary emitter, EMI-BF4, opposed by a plate extractor.
#
# Values carry units: 10um, 1.5kV, 500Pa, 0.5nL/s, 25C, 15deg.  A bare number
# is taken as SI.  Any key can be overridden on the command line:
#
#   es_meniscus examples/capillary_emibf4.cfg emitter.r_bore=5um
# -------------------------------------------------------------------------

[fluid]
name              = EMI-BF4
temperature       = 25C
# The activation energy for ion evaporation is the primary fitting knob when
# matching measured I-V curves.  Literature values span roughly 1.0-1.4 eV.
dg_ev             = 1.09
solvation_n       = 0.4

[emitter]
type              = capillary     # open bore, so a meniscus can be solved on it
r_bore            = 10um
r_outer           = 20um
shank_length      = 1mm
z_tip             = 0
h_tip             = 0.8um         # element size at the rim
h_far             = 40um

[extractor]
enabled           = true
gap               = 500um         # tip to the emitter-facing extractor surface
aperture_radius   = 200um
outer_radius      = 3mm
thickness         = 100um
h_edge            = 10um
h_far             = 150um

[meniscus]
delta_p           = 0Pa           # feed pressure above ambient at the apex
n_nodes           = 81
apex_clustering   = 1.8
h_min             = 0.15          # in units of r_contact
h_max             = 2.0
steps             = 22
relax             = 0.5
tol               = 3e-4

[solve]
voltage           = 1100V         # emitter-to-extractor

[operate]
flow_rate         = 0             # 0 = pure ionic regime, no droplets

[beam]
species           = ion
z_end             = 2mm
cfl               = 0.04
space_charge_iters = 0

[output]
prefix            = out_capillary
grid              = false
