# ---------------------------------------------------------------------------
# P1 -- Druckhaushalt am Austritt
#
# Wird ZUSAETZLICH zu examples/device_p1.cfg geladen.
#
#   ./build/es_feed examples/device_p1.cfg examples/feed_p1.cfg \
#       results/<ordner> meta.commit=$(git rev-parse HEAD)
#   python python/plot_feed.py results/<ordner>
#
# WAS DIESER LAUF IST
#
#     delta_p_exit = (p_reservoir - p_vacuum) - delta_p_hydrostatisch
#                                             - delta_p_viskos
#
# mit dem viskosen Term als laminarem Hagen-Poiseuille-Verlust eines geraden,
# VOLLSTAENDIG GEFUELLTEN Kreiskanals.
#
# WAS DIESER LAUF NICHT IST
#
# Kein Stroemungsloeser: eine geschlossene Widerstandsformel, stationaer,
# laminar, ausgebildet, inkompressibel.  KEIN kapillarer Aufstieg und KEINE
# bewegliche Kontaktlinie -- der Kanal ist voll, hat dort also gar keine freie
# Oberflaeche und keinen Young-Winkel, der eingesetzt werden koennte.  Die
# einzige freie Oberflaeche ist der gepinnte Meniskus an der Austrittskante;
# dessen Kapillardruck rechnet P3a/P3b und er wird hier NICHT ein zweites Mal
# addiert.  Der Vorrat ist eine Randbedingung, kein Volumen.
#
# p_reservoir und flow_rate sind EINGABEN.  Dieser Lauf berechnet weder den
# Vorratsdruck noch den Volumenstrom; das braeuchte die Emission, die es in
# dieser Phase nicht gibt.
# ---------------------------------------------------------------------------

[device]
emitter_back_length         = 0
base_plate_thickness        = 140um

[liquid]
# EMI-BF4 bleibt illustrative: rho und mu tragen keine Primaerquelle.  Jede
# absolute Druckangabe dieses Laufs ist deshalb ein Rechenbeispiel.
name                        = emi-bf4

[feed]
# 'budget' rechnet den Haushalt, 'direct' gibt delta_p_exit unveraendert weiter
# (der Modus, mit dem P3a und P3b gerechnet wurden; er bleibt erhalten, damit
# jedes vorhandene Ergebnis reproduzierbar bleibt).
mode                        = budget

# Antrieb.  BEISPIELWERT, keine Messung: es gibt keine belegte Angabe zum
# Vorratsdruck dieses Geraets.  Der Wert ist bewusst GENAU eine Kapillardruck-
# skala gamma/a = 9040 Pa, damit die Studien unten auf der einzigen Skala
# liegen, die das Problem selbst liefert -- er ist kein Betriebspunkt.
p_reservoir                 = 9040Pa
p_vacuum                    = 0Pa

# Referenzhoehe und Schwerkraft.  z waechst zum Extraktor hin; die Austritts-
# ebene ist z_exit.  gravity_axial ist die Komponente von g entlang +z und ist
# NULL, weil das modellierte Geraet ein Raumfahrttriebwerk ist.  Auf dem Tisch
# mit nach oben zeigendem Emitter waere sie -9.80665.
z_exit                      = 0m
z_reservoir                 = 0m
gravity_axial               = 0

# Zulaufkanal: gerade, kreisrund, VOLL gefuellt.  Der Radius ist der der
# Bohrung, die Laenge die des Zulaufs aus der P2c-Vorratsgeometrie.
channel_radius              = 5um
channel_length              = 300um

# Volumenstrom.  EINGABE.  Der Nennwert ist null: ohne Emission stroemt nichts,
# und ein von null verschiedener Wert waere eine Behauptung ueber einen Betrieb,
# den diese Phase nicht rechnet.  Die Studien unten fahren ihn trotzdem durch,
# ausdruecklich als Parameterstudie.
flow_rate                   = 0
# Der Referenzstrom ist so gewaehlt, dass der viskose Verlust in der Groessen-
# ordnung der Kapillarskala liegt; die Obergrenze faehrt den Haushalt durch die
# ganze Spanne, in der ueberhaupt eine gepinnte statische Form existiert.
flow_rate_reference         = 1e-13
flow_rate_max               = 6e-13

# Ein Kontaktwinkel ist hier KEIN Schluessel und laesst den Lauf abbrechen:
# feed.contact_angle_deg, capillary.contact_angle_deg, wetting.contact_angle_deg
# und liquid.contact_angle_deg sind alle verboten.
