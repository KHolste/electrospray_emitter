# ---------------------------------------------------------------------------
# P2b -- dielektrische Elektrostatik des kapillaren Kunze-Emitters
#
# Wird ZUSAETZLICH zu examples/device_p1.cfg geladen und ueberschreibt einzelne
# Werte daraus.
#
#   ./build/es_dielectric examples/device_p1.cfg examples/dielectric_p2b.cfg \
#       results/<ordner> meta.commit=$(git rev-parse HEAD)
#   python python/plot_dielectric.py results/<ordner>
#
# KORRIGIERTER MODELLVERTRAG gegenueber P2a:
#   * Der 3D-gedruckte Emitterkoerper ist ein DIELEKTRIKUM, kein Leiter.
#   * Auf Hochspannung liegt die ionische Fluessigkeit bzw. ihr metallischer
#     Kontakt.
#   * Der Extraktor ist ein Polymertraeger mit metallisierter Elektrodenflaeche;
#     nur die Metallisierung liegt auf V_extractor.
#   * Das Reservoir wird nicht vernetzt. Die Fluessigkeit wird bei
#     feed.liquid_feed_z abgeschnitten; dort gilt die Dirichlet-Bedingung
#     AUSSCHLIESSLICH auf dem Fluessigkeitsquerschnitt r <= phi_2/2.
#
# NICHT modelliert: Raumladung, Emission, Meniskusbewegung, Stroemung, endliche
# Leitfaehigkeit der Fluessigkeit, Zeitabhaengigkeit, 3D.
# ---------------------------------------------------------------------------

[device]
# Der metallische P2a-Emitter mit leitender Abschlussscheibe ist fuer dieses
# System physikalisch falsch. es_dielectric lehnt einen Wert ungleich 0 ab.
emitter_back_length         = 0

[domain]
# Die P1-Box von 3 mm ist fuer eine Volumenrechnung viel zu klein: dort
# unterscheiden sich die asymptotische Fernrandbedingung und eine geerdete
# Huelle noch um 13 % der angelegten Spannweite. Bei 12 mm sind es 1e-4, und
# eine Vervierfachung auf 48 mm aendert das Ergebnis um 1e-5 der Spannweite.
# Siehe farfield_study.csv im Ergebnisordner.
#
# Die BEM in P2a brauchte das nicht: ihr Kern traegt V -> 0 im Unendlichen
# bereits in sich und hat ueberhaupt keinen Trunkierungsrand.
radius                      = 12mm
z_min                       = -5mm
z_max                       = 9mm

[feed]
# Lage der Zulaufgrenze: hier endet die modellierte Fluessigkeitssaeule.
#
# BEISPIELWERT, keine gemessene Abmessung. Es ist KEIN Konvergenzparameter:
# convergence_feed.csv zeigt, dass weder das Potential noch das Feld am
# Meniskus gegen eine Rueckverlagerung konvergiert. Die Fluessigkeitssaeule ist
# ein Leiter auf V_emitter; eine laengere Saeule traegt proportional mehr
# Ladung, und diese Ladung wird an der Spitze gespuert. Eine geerdete Huelle
# aendert daran nichts -- es liegt nicht am offenen Rand.
#
# Der fehlende Modellbestandteil ist der Emitterhalter: 04_geometry_model.md,
# Abschnitt 4.1, sieht eine Basisplatte auf Emitterpotential vor. Sie
# einzufuehren ist eine Geometrieentscheidung fuer eine spaetere Phase. Die
# hintere Schnittebene ALS SOLCHE zur Elektrode zu erklaeren waere keine.
#
# Semantisch ist diese Grenze bereits der HYDRAULISCHE Zulauf: dort wird in P3
# Reservoirdruck, Volumenstrom oder eine hydraulische Impedanz vorgegeben. In
# diesem Lauf ist nichts davon implementiert.
liquid_feed_z               = -200um

[emitter]
# Werkstoff des gedruckten Emitterkoerpers. Bekannt: su8, ip-q, ipx-q.
# ip-q und ipx-q sind registriert, tragen aber bewusst KEINEN Wert; sie
# abzufragen bricht ab, statt eine Zahl zu erfinden. Ein Wert wird ueber
# material.<name>.relative_permittivity und material.<name>.source ergaenzt --
# ohne Codeaenderung.
material                    = su8

[extractor]
material                    = su8
# Welche Flaechen des Polymertraegers die Metallisierung tragen:
#   front_only          nur die emitterzugewandte Flaeche
#   front_and_aperture  Vorderflaeche und Aperturwand   (Referenzfall)
#   all_surfaces        vollstaendig metallisierte Elektrode
metallisation               = front_and_aperture

[field]
# Absolut gegen phi(unendlich) = 0. Pflichtangaben, keine Vorgabewerte.
V_emitter                   = 1500V
V_extractor                 = 0V

[mesh]
# Einziger Netzsteuerwert. Das Groessenfeld wird als Ganzes mit 2^(-Stufe/2)
# skaliert; es gibt keine Elementgroesse und keine Verfeinerungszone in der
# Benutzerschnittstelle. Stufe 4 braucht rund 0.8 GiB fuer die Bandzerlegung.
reference_level             = 3
max_level                   = 4

# ---------------------------------------------------------------------------
# Beispiel fuer das Nachreichen eines Materialwerts. Auskommentiert, weil fuer
# IP-Q kein belastbarer Wert vorliegt und ein erfundener schlimmer waere als
# ein Abbruch. Ohne material.ip-q.source wird der Wert abgelehnt.
# ---------------------------------------------------------------------------
# material.ip-q.relative_permittivity = 3.0
# material.ip-q.status                = provisional
# material.ip-q.source                = "hier die Primaerquelle nennen"
