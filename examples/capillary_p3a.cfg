# ---------------------------------------------------------------------------
# P3a -- statischer Kapillarmeniskus ohne elektrisches Feld
#
# Wird ZUSAETZLICH zu examples/device_p1.cfg geladen und ueberschreibt einzelne
# Werte daraus.
#
#   ./build/es_capillary examples/device_p1.cfg examples/capillary_p3a.cfg \
#       results/<ordner> meta.commit=$(git rev-parse HEAD)
#   python python/plot_capillary.py results/<ordner>
#
# WAS DIESER LAUF IST
#
# Die Form der freien Fluessigkeitsoberflaeche an der Austrittskante, gehalten
# allein von der Oberflaechenspannung gegen einen vorgegebenen Fluessigkeits-
# druck:
#
#     gamma (dpsi/ds + sin psi / r) = delta_p_exit,
#     delta_p_exit = p_fluessig - p_vakuum an der Austrittsebene z = 0.
#
# WAS DIESER LAUF NICHT IST
#
# Kein elektrisches Feld, kein Maxwell-Druck, keine Kopplung an den
# Elektrostatiksolver, keine Emission, keine Raumladung, keine Stroemung, keine
# Zeitabhaengigkeit, keine Stabilitaetsaussage, kein Taylor-Kegel, kein
# Cone-Jet. Keine Schwerkraft -- die Bond-Zahl, die das rechtfertigt, wird
# ausgerechnet und berichtet, nicht unterstellt.
#
# Die Bohrung gilt als bis zur Kante gefuellt. Der kapillare Aufstieg aus dem
# Vorrat wird NICHT gerechnet; der Zustand stromauf geht ausschliesslich ueber
# delta_p_exit ein. Die P2c-Vorratsgeometrie bleibt unveraendert.
# ---------------------------------------------------------------------------

[liquid]
# Stoffdatensatz. "emi-bf4" ist eingebaut und ausdruecklich als illustrative
# gekennzeichnet.
#
# BELEGT ist die Stoffidentitaet: KunzeFynn-2024-12-10.pdf, Abschnitt 2.3.2,
# gedruckte Seite 28 (PDF-Seite 36) -- "EMI-BF4 and EMI-Im were also selected
# for this project" -- sowie die Tabelle "List of Publications", gedruckte
# Seite 30 (PDF-Seite 38), die EMI-BF4 den Publikationen I bis IV zuordnet,
# also genau den geraden 10-um-Kapillaren aus SU-8 bzw. IP-Q.
#
# NICHT BELEGT sind die Zahlenwerte. Die Dissertation enthaelt keine
# Stoffwerttabelle und keinen numerischen Wert fuer Oberflaechenspannung oder
# Dichte; der Volltext wurde darauf durchsucht. gamma und rho stammen
# unveraendert aus der quellenlosen Tabelle in src/fluid.cpp. Deshalb steht der
# Datensatz auf illustrative, und deshalb laeuft die Pruefung des Loesers
# unabhaengig davon dimensionslos.
name                        = emi-bf4

# Ein eigener Satz wird vollstaendig angegeben. Mit einem anderen Status als
# illustrative ist liquid.source PFLICHT; ohne Fundstelle bricht der Lauf ab.
# substance                 = "EMI-BF4, Charge XY, vakuumgetrocknet"
# temperature               = 25C
# surface_tension           = 0.0452      # N/m
# density                   = 1279        # kg/m^3
# status                    = measured
# source                    = "hier die Primaerquelle mit Seite nennen"

# Nur dokumentarisch vorgemerkt. Diese drei Groessen gehen in P3a NICHT in das
# Gleichgewicht ein und duerfen nicht als beruecksichtigte Physik gelesen
# werden: Viskositaet braucht eine Stroemung, Leitfaehigkeit einen
# Ladungstransport, eps_r eine Feldkopplung. Alles drei kommt spaeter.
# viscosity                 = 0.0371      # Pa s
# conductivity              = 1.36        # S/m
# relative_permittivity     = 12.8

[capillary]
# Die EINZIGE Diskretisierungsangabe: die geforderte relative Genauigkeit des
# Profils, bezogen auf den Bohrungsradius. Die Intervallzahl waehlt der Loeser
# daraus selbst, durch Verdopplung, bis die Aenderung zur halben Aufloesung
# darunter liegt. Es gibt bewusst kein h_tip, kein h_far und keine Knotenzahl.
accuracy                    = 1e-11

# Ein Kontaktwinkel ist hier KEIN Schluessel. Die Kontaktlinie ist an der
# scharfen Austrittskante gepinnt; ein zusaetzlicher Young-Winkel wuerde
# dieselbe Kante ein zweites Mal festlegen. capillary.contact_angle_deg,
# wetting.contact_angle_deg und liquid.contact_angle_deg lassen den Lauf
# ausdruecklich abbrechen, statt eine der beiden Beschreibungen still zu
# bevorzugen.

# Die Druckreihe selbst steht im Programm: sie ist die Vergleichsreihe dieses
# Laufs und keine Benutzereingabe. Gerechnet werden mehrere positive und
# negative dimensionslose Druecke Pi = delta_p a / gamma, ein Wert nahe der
# hemisphaerischen Grenze |Pi| = 2, ein voller Sweep ueber den darstellbaren
# Bereich einschliesslich seiner Grenze, eine Netzstudie ueber fuenf
# Aufloesungen und ein gesondert gekennzeichnetes Stoffbeispiel.
