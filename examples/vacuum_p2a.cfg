# ---------------------------------------------------------------------------
# P2a -- statische Vakuum-Elektrostatik auf der P1-Geometrie
#
# Wird ZUSAETZLICH zur Geometriedatei geladen; die Geometrie steht weiterhin
# ausschliesslich in examples/device_p1.cfg.
#
#   ./build/es_vacuum examples/device_p1.cfg examples/vacuum_p2a.cfg \
#       results/<ordner> meta.commit=$(git rev-parse HEAD)
#   python python/plot_vacuum.py results/<ordner>
#
# Geloest wird ausschliesslich: ladungsfreies Vakuum (rho = 0), Emittermetall
# und die anfaengliche ebene Fluessigkeitsoberflaeche bei z = 0 auf V_emitter,
# Extraktor auf V_extractor, V -> 0 im Unendlichen.
#
# Die ebene Flaeche bei z = 0 ist eine Perfect-Conductor-Referenz. Sie ist kein
# berechneter Meniskus, kein emittierender Meniskus und keine Aussage ueber das
# Pure-Ion-Regime. Keine Meniskusverformung, keine endliche Leitfaehigkeit,
# keine Emission, keine Stroemung, keine Raumladung.
# ---------------------------------------------------------------------------

[bem]
# Absolut gegen V(unendlich) = 0. Pflichtangaben, keine Vorgabewerte.
# Beispielwerte: geerdete Extraktionselektrode, Emitter auf positivem Potential.
V_emitter                   = 1500V
V_extractor                 = 0V
