# ---------------------------------------------------------------------------
# P2a -- statische Vakuum-Elektrostatik auf der P1-Geometrie
#
# Wird ZUSAETZLICH zur Geometriedatei geladen und ueberschreibt einzelne Werte
# daraus; die uebrige Geometrie steht weiterhin in examples/device_p1.cfg.
#
#   ./build/es_vacuum examples/device_p1.cfg examples/vacuum_p2a.cfg \
#       results/<ordner> meta.commit=$(git rev-parse HEAD)
#   python python/plot_vacuum.py results/<ordner>
#
# Geloest wird ausschliesslich: ladungsfreies Vakuum (rho = 0), Emittermetall
# und die anfaengliche ebene Fluessigkeitsoberflaeche bei z = 0 auf V_emitter,
# Extraktor auf V_extractor, V -> 0 im Unendlichen.
#
# Die ebene Flaeche bei z = 0 ist eine Perfect-Conductor-Referenz. Sie ist kein
# berechneter Meniskus, kein emittierender Meniskus und keine Aussage ueber das
# Pure-Ion-Regime. Keine Meniskusverformung, keine endliche Leitfaehigkeit,
# keine Emission, keine Stroemung, keine Raumladung.
# ---------------------------------------------------------------------------

[device]
# Rueckwaertige Laenge des modellierten Emitterleiters, von der Stirnebene
# z = 0 aus gemessen. PFLICHTANGABE fuer P2a.
#
# Der Leiter aus Emittermetall und Fluessigkeitssaeule endet bei z = -diesem
# Wert und wird dort durch eine volle leitende Scheibe auf V_emitter
# geschlossen (Randkennung numerical_emitter_back_closure). Ohne diese
# Schliessung endet der Leiter offen am Modellschnitt; eine Einfachschicht auf
# einer offenen Flaeche traegt die Summe beider Seiten, und sigma/eps0 waere
# dort kein einseitiges Vakuumfeld. es_vacuum lehnt das ab.
#
# BEISPIELWERT, keine gemessene Abmessung -- genau wie extractor_outer_radius.
# Es ist KEIN Konvergenzparameter: die Trunkierungsstudie in truncation.csv
# zeigt, dass weder E_z am Referenzpunkt noch c_EX gegen wachsende Laenge
# konvergiert. Jeder berichtete Wert gilt fuer diese Laenge.
emitter_back_length         = 800um

[domain]
# Die Trunkierungsstudie verlaengert den Leiter bis auf das Doppelte von
# emitter_back_length und haelt dabei die Domaene fest, damit sich das
# Groessenfeld -- und mit ihm das Netz an Spitze und Extraktor -- nicht
# zusammen mit der Laenge aendert. z_min muss deshalb unter dem doppelten
# emitter_back_length liegen. Die Domaene ist weiterhin kein Leiter und traegt
# keine Randbedingung; sie legt nur das Groessenfeld und den gezeichneten
# Ausschnitt fest.
z_min                       = -2mm

[bem]
# Absolut gegen V(unendlich) = 0. Pflichtangaben, keine Vorgabewerte.
# Beispielwerte: geerdete Extraktionselektrode, Emitter auf positivem Potential.
V_emitter                   = 1500V
V_extractor                 = 0V
