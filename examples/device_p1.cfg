# ---------------------------------------------------------------------------
# Beispiel-Parametersatz der parametrischen P1-Geometrie
#
# Achsensymmetrisch in der Meridianhalbebene (r, z). z = 0 ist die Stirnebene
# des Emitters, z waechst zur Extraktionselektrode. Werte tragen Einheiten;
# intern wird ausschliesslich in SI gerechnet.
#
#   ./build/device_figure examples/device_p1.cfg results/<ordner>
#   python python/plot_device.py results/<ordner>
# ---------------------------------------------------------------------------

[device]
# Aussendurchmesser am Emitterfuss (Fuss des Kegelstumpfs)
phi_3                       = 40um
# Aussendurchmesser der Stirnflaeche
phi_1                       = 20um
# Durchmesser der Austrittsbohrung; zugleich der Radius der gepinnten
# Kontaktlinie. Bohrung in dieser Stufe zylindrisch.
phi_2                       = 10um
# Axiale Laenge der aeusseren Verjuengung
emitter_height              = 60um
# Stirnebene bis emitterseitige Flaeche der Extraktionselektrode
extraction_distance         = 500um
extractor_aperture_diameter = 400um
extractor_thickness         = 100um
# 0 = ringfoermige Elektrode reicht bis zum Domaenenrand (wie in der Skizze)
extractor_outer_radius      = 0

[domain]
# Offene Rechendomaene. Kein Leiter, keine Randbedingung in dieser Stufe.
radius                      = 3mm
z_min                       = -400um
z_max                       = 1500um

# ---------------------------------------------------------------------------
# Reserviert fuer spaetere Phasen. Strukturell vorgesehen, NICHT umgesetzt.
# Ein Wert ungleich 0 bzw. false laesst den Aufbau geschlossen fehlschlagen,
# statt eine Geometrie vorzutaeuschen, die nicht gebaut wird.
# ---------------------------------------------------------------------------
[reserved]
edge_radius_inner           = 0      # Verrundung der Austrittskante        (P3)
edge_radius_outer           = 0      # Verrundung der aeusseren Stirnkante  (P3)
contact_angle_deg           = 0      # Young-Bedingung statt Pinning        (P3)
bore_diameter_at_inlet      = 0      # verjuengte Bohrung                (spaeter)
porous_emitter              = false  # Darcy- statt Poiseuille-Speisung  (spaeter)
collector_enabled           = false  # Kollektorelektrode                (spaeter)
