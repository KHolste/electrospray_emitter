# ---------------------------------------------------------------------------
# P3b -- selbstkonsistentes statisches Elektro-Kapillargleichgewicht
#
# Wird ZUSAETZLICH zu examples/device_p1.cfg geladen.
#
#   ./build/es_electrocapillary examples/device_p1.cfg examples/electrocapillary_p3b.cfg \
#       results/<ordner> meta.commit=$(git rev-parse HEAD)
#   python python/plot_electrocapillary.py results/<ordner>
#
# WAS DIESER LAUF IST
#
#     gamma kappa(s) = delta_p_exit + eps0 E_n(s)^2 / 2
#
# mit E_n dem vakuumseitigen Normalfeld auf der freien Oberflaeche der
# Fluessigkeit, die ein idealer Leiter auf V_emitter ist. Die Elektrostatik ist
# das unveraenderte dielektrische P2c-Problem: die Polymerkoerper polarisieren
# und sind nie Elektroden.
#
# WAS DIESER LAUF NICHT IST
#
# Keine Emission, keine endliche Leitfaehigkeit der Fluessigkeit, keine
# Stroemung, keine Viskositaet, keine Raumladung, keine Zeitabhaengigkeit, keine
# dynamische Stabilitaet, kein Taylor-Kegel-Onset, kein Cone-Jet. Aus einem
# Abbruch oder Umkehrpunkt darf keine Stabilitaets- oder Emissionsaussage
# abgeleitet werden. delta_p_exit bleibt eine EINGABE.
# ---------------------------------------------------------------------------

[device]
# Die leitende P2a-Abschlussscheibe bleibt abgelehnt.
emitter_back_length         = 0
# Dicke des dielektrischen Grundkoerpers hinter dem Kegelfuss. VORLAEUFIGER
# BEISPIELWERT, wie in P2c; in jeder Vergleichsrechnung derselbe.
base_plate_thickness        = 140um

[domain]
# Wie in P2c: offene Rechendomaene, in P2b gegen eine geerdete Huelle geprueft.
radius                      = 12mm
z_min                       = -12mm
z_max                       = 9mm

[reservoir]
# Unveraenderte P2c-Vorratsgeometrie. Sie wird in P3b weder variiert noch
# mechanisch geloest; sie steht hier, weil sie die Elektrode ist, deren Feld am
# Meniskus ankommt.
feed_channel_length         = 300um
feed_channel_radius         = 0
plenum_radius               = 2.5mm
plenum_depth                = 1.0mm
wall_thickness              = 500um

[emitter]
material                    = su8

[extractor]
material                    = su8
metallisation               = front_and_aperture

[liquid]
# Stoffdatensatz mit Status und Fundstelle; siehe docs/09_capillary_model.md 9.4.
# EMI-BF4 bleibt illustrative, solange gamma und rho nicht mit Temperatur und
# Quelle belegt sind. Jede physikalische Abbildung dieses Laufs muss das nennen.
name                        = emi-bf4

[field]
# Spannung der VORGESCHRIEBENEN Formen, an denen das Kanten-Gate und die
# Feldabbildungen gerechnet werden. Nicht der Betriebspunkt des gekoppelten
# Astes -- der wird fortgesetzt.
V_probe                     = 1500V
# Obergrenze der Fortsetzung. Sie ist eine Schranke des Suchbereichs und keine
# Behauptung ueber eine erreichbare Spannung; der Ast endet, wo dieser Loeser
# stehen bleibt.
V_max                       = 4000V

[mesh]
# Netzstufe der gekoppelten Rechnung. Einziger Netzsteuerwert; das Groessenfeld
# wird als Ganzes mit 2^(-Stufe/2) skaliert.
reference_level             = 2
# Stufen des Kanten-Gates. Mindestens vier, weil die Frage dort eine
# Konvergenzfrage ist.
gate_min_level              = 1
gate_max_level              = 4

# Ein Kontaktwinkel ist auch hier KEIN Schluessel: die Kontaktlinie ist an der
# scharfen Austrittskante gepinnt. capillary.contact_angle_deg,
# wetting.contact_angle_deg und liquid.contact_angle_deg lassen den Lauf
# ausdruecklich abbrechen.
