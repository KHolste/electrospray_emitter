# ---------------------------------------------------------------------------
# P2c -- Entkopplung von Geraetegeometrie und Fluessigkeitsvorrat
#
# Wird ZUSAETZLICH zu examples/device_p1.cfg geladen und ueberschreibt einzelne
# Werte daraus.
#
#   ./build/es_reservoir examples/device_p1.cfg examples/reservoir_p2c.cfg \
#       results/<ordner> meta.commit=$(git rev-parse HEAD)
#   python python/plot_reservoir.py results/<ordner>
#
# WAS DIESER LAUF KORRIGIERT
#
# Bisher verschob ein einziger Wert -- feed.liquid_feed_z -- gleichzeitig
#   * die Laenge der leitfaehigen Fluessigkeitssaeule,
#   * die Laenge des dielektrischen Rueckteils,
#   * die rueckwaertige Gerategeometrie.
# Eine Studie darueber war deshalb keine Randverschiebung, sondern eine
# Aenderung der Geometrie der Hochspannungselektrode. Der Schluessel gibt es
# nicht mehr; es_dielectric und es_reservoir brechen mit einer Erklaerung ab,
# wenn er noch gesetzt ist.
#
# Die Lage eines vollstaendig eingetauchten elektrischen Kontakts ist im Modell
# des ideal leitfaehigen Fluessigkeitskoerpers irrelevant und wird gar nicht
# geometrisch dargestellt.
#
# NICHT modelliert: Oberflaechenspannung, Meniskus, Stroemung, Emission,
# Raumladung, 3D.
# ---------------------------------------------------------------------------

[device]
# Die leitende P2a-Abschlussscheibe bleibt abgelehnt.
emitter_back_length         = 0

# Dicke des DIELEKTRISCHEN Grundkoerpers hinter dem Kegelfuss. Sein Radius ist
# der Fussradius phi_3/2, also die zylindrische Fortsetzung der gedruckten
# Struktur.
#
# VORLAEUFIGER BEISPIELWERT, keine belegte Abmessung. Die Dissertation
# bemasst die verjuengte Struktur, nicht das, was sie traegt;
# 04_geometry_model.md las aus einem schraffierten Balken eine breite
# "Basisplatte auf Emitterpotential" heraus -- weder bemasst noch elektrisch
# richtig, siehe docs/08_dielectric_model.md, 8.9.
#
# Dieser Wert ist in JEDER Vergleichsrechnung derselbe. Er gehoert zur festen
# Frontgeometrie und wird nicht variiert.
base_plate_thickness        = 140um

[domain]
# Offene Rechendomaene. 12 mm radial ist in P2b gegen eine geerdete Huelle
# geprueft (farfield_study.csv dort). z_min ist gegenueber P2b nach hinten
# gezogen, weil der modellierte Vorratskoerper Platz braucht: die groesste
# gerechnete Variante endet bei z = -7.0 mm, also mit reichlich Abstand zum
# Rand.
radius                      = 12mm
z_min                       = -12mm
z_max                       = 9mm

[reservoir]
# Fester Zulaufkanal zwischen der Rueckflaeche des Grundkoerpers und der Decke
# des Fluessigkeitsraums -- zugleich die Dicke der oberen Wand des
# Vorratskoerpers, die er durchstoesst.
#
# VORLAEUFIGE BEISPIELWERTE. Beide sind in jeder Vergleichsrechnung gleich.
feed_channel_length         = 300um
# 0 bedeutet "gleich dem Bohrungsradius". Groesser als der Bohrungsradius ist
# nicht darstellbar: dort beginnt die radial gewarpte Zone des Vernetzers.
feed_channel_radius         = 0
# Wandstaerke und Bodendicke des dielektrischen Vorratskoerpers.
wall_thickness              = 500um

# Werkstoff des Vorratskoerpers. Im gebauten Geraet ist es PEEK; "peek" ist in
# der Materialbibliothek registriert, traegt aber ABSICHTLICH keinen Wert, weil
# kein geprueftes statisches eps_r vorliegt. Ohne diesen Schluessel rechnet der
# Lauf mit dem Emitterharz als ausdruecklich gekennzeichnetem STELLVERTRETER.
#
# Ein Wert wird ohne Codeaenderung nachgereicht:
#   material.peek.relative_permittivity = 3.2
#   material.peek.status                = manufacturer_spec
#   material.peek.source                = "hier die Primaerquelle nennen"
#   reservoir.material                  = peek
# material                    = peek

# Die Plenumgroessen selbst stehen im Programm: sie sind die Vergleichsreihe
# dieses Laufs und keine Benutzereingabe. Gerechnet werden die abgeschnittene
# Saeule als Diagnose, drei Plenumgroessen und eine zusaetzliche
# Vergroesserungsstufe, dazu ein halb gefuelltes Plenum.

[emitter]
material                    = su8

[extractor]
material                    = su8
metallisation               = front_and_aperture

[field]
V_emitter                   = 1500V
V_extractor                 = 0V

[mesh]
# Einziger Netzsteuerwert. Das Groessenfeld wird als Ganzes mit 2^(-Stufe/2)
# skaliert. Die Vergleichsreihe laeuft auf reference_level, die Netzstudie bei
# festem Plenum bis max_level -- damit der Diskretisierungsfehler und die
# Wirkung der Vorratsgroesse getrennt beziffert werden koennen.
reference_level             = 3
max_level                   = 4
